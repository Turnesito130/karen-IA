name: Karen training checks

on:
  push:
    branches:
      - arquitectura/cerebro-propio-0.1
  pull_request:
    branches:
      - arquitectura/cerebro-propio-0.1

permissions:
  contents: read

jobs:
  training-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run CPU-only training pipeline tests
        run: python -m unittest discover -s training/tests -v
      - name: Compile training scripts
        run: python -m compileall -q training
