name: Karen training toolkit tests

on:
  push:
    branches:
      - arquitectura/cerebro-propio-0.1
    paths:
      - "training/**"
      - "js/neural-core/**"
      - ".github/workflows/karen-training-tests.yml"
  pull_request:
    branches:
      - arquitectura/cerebro-propio-0.1
    paths:
      - "training/**"
      - "js/neural-core/**"
      - ".github/workflows/karen-training-tests.yml"

jobs:
  neural-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: find js/neural-core -type f \( -name "*.mjs" -o -name "*.js" \) -print0 | xargs -0 -n1 node --check
      - name: Test memory, autonomy and knowledge modules
        run: node --test js/neural-core/tests/*.test.mjs

  training-toolkit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile training scripts
        run: python -m compileall -q training
      - name: Run unit tests (no GPU required)
        run: python -m unittest discover -s training/tests -v
